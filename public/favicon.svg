<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="107" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Outer Cog / Gear ring -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <circle r="150" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-dasharray="32 18" opacity="0.85" />
    <circle r="126" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

    <!-- Stylized Crossed Wrench & Screwdriver -->
    <!-- Wrench (diagonal from top-left to bottom-right) -->
    <g transform="rotate(-45)">
      <!-- Shaft -->
      <rect x="-18" y="-110" width="36" height="220" rx="14" fill="url(#silverGrad)" />
      <!-- Top Open Jaw -->
      <path d="M -46 -100 C -46 -150 46 -150 46 -100 C 46 -75 22 -65 18 -92 L -18 -92 C -22 -65 -46 -75 -46 -100 Z" fill="url(#silverGrad)" />
      <path d="M -22 -146 L 22 -146 L 16 -108 L -16 -108 Z" fill="#0f172a" />
      <!-- Bottom Ring End -->
      <circle cx="0" cy="105" r="38" fill="url(#silverGrad)" />
      <circle cx="0" cy="105" r="20" fill="#0f172a" />
    </g>

    <!-- Center Accent Dot / Car Detail -->
    <circle r="12" fill="#fbbf24" stroke="#ffffff" stroke-width="3" />
  </g>
</svg>
